[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mdeberta-nli"
version = "0.1.0"
description = "mDeBERTa-based NLI model training and inference"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "transformers",
    "datasets",
    "accelerate",
    "evaluate",
    "scikit-learn",
    "sentencepiece",
    "protobuf",
    "tensorboard",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mdeberta_nli"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
